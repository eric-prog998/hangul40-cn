# Runs on every push to main and on every pull request:
# type check, lint, the logic tests and the real-browser tests.
# It only checks the code. It never deploys the website.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Logic tests (builds the site first)
        run: npm test

      - name: Install the test browser
        run: npx playwright install --with-deps chromium webkit

      - name: Real-browser tests
        run: npm run test:e2e

      - name: Keep the browser test report when something failed
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
